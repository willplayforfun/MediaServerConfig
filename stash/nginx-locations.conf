location /stash/ {
    set $stash_upstream stash;
    # Strip the /stash/ prefix before proxying (equivalent to the trailing-slash
    # proxy_pass form, which can't be used together with a variable upstream).
    rewrite ^/stash/(.*)$ /$1 break;
    proxy_pass http://$stash_upstream:9999;

    proxy_http_version 1.1;
    proxy_set_header Upgrade             $http_upgrade;
    proxy_set_header Connection          "Upgrade";
    proxy_set_header Host               $http_host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /stash;
    proxy_read_timeout 60000s;
}
