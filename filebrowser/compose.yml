services:
  # ── Filebrowser ────────────────────────────────────────────────────────────
  # Web-based file browser. Root directory is controlled by FILEBROWSER_ROOT
  # in .env — point it at whatever SMB share OMV exposes (by default the
  # share/ folder under MEDIA_ROOT).
  # Database and user accounts are persisted in ./data/ at runtime.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    profiles: ["filebrowser"]
    user: root
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init.sh"]
    ports:
      - "8085:80"
    environment:
      - INITIAL_FILEBROWSER_PASSWORD=${INITIAL_FILEBROWSER_PASSWORD}
    volumes:
      - ${FILEBROWSER_ROOT:?run env-setup.sh}:/srv
      - ./data:/database
      - ./settings.json:/config/settings.json:ro
      - ./init.sh:/init.sh:ro
