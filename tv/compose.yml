# TV launcher: a "smart TV" home screen plus full-screen apps for a display
# plugged into the server's HDMI output (see OperationsGuide.md).
#
#  - tv-hub (profile "tv", always running): serves the launcher page,
#    switches apps, reads the remote, and sleeps/wakes the display.
#  - tv-home / tv-youtube / ... (profile "tv-apps"): one container per app.
#    Each renders straight to DRM/KMS with no compositor, so only one may run
#    at a time and only the hub starts them. "tv-apps" is never added to
#    COMPOSE_PROFILES, so a plain `docker compose up` (what OMV runs on boot)
#    never starts two at once and fights over the GPU. They still need
#    creating once (env-setup.sh offers to):
#      docker compose --profile tv-apps create
#
# Adding an app: give it a service in the "tv-apps" profile and add
# <name>=<container_name> to the hub's APPS. Tile labels/colours for known
# names live in hub/app.py's APP_META.

x-tv-browser: &tv-browser
  # Relative to this file (tv/compose.yml), not the root docker-compose.yml
  # that includes it - Compose's `include:` resolves relative paths against
  # the included file's own directory.
  build:
    context: ./browser
  image: homeserver-tv-browser:local
  pull_policy: never
  profiles: ["tv-apps"]
  restart: "no"
  init: true
  devices:
    - /dev/dri:/dev/dri
    - /dev/snd:/dev/snd
    - /dev/input:/dev/input
  group_add:
    - video
    - audio
  volumes:
    - /etc/localtime:/etc/localtime:ro
    # libinput classifies input devices from the live udev database.
    - /run/udev:/run/udev:ro

services:
  tv-hub:
    build:
      context: ./hub
    image: homeserver-tv-hub:local
    pull_policy: never
    container_name: tv-hub
    profiles: ["tv"]
    restart: unless-stopped
    environment:
      - APPS=home=tv-home,youtube=tv-youtube
      # Set by env-setup.sh. REMOTE_DEVICES blank = watch every input device.
      - REMOTE_DEVICES=${REMOTE_DEVICES:-}
      - HOME_KEY=${HOME_KEY:-KEY_HOMEPAGE}
      - SLEEP_KEY=${SLEEP_KEY:-}
      - HOME_IDLE_MINUTES=${TV_HOME_IDLE_MINUTES:-10}
      - APP_IDLE_MINUTES=${TV_APP_IDLE_MINUTES:-240}
      - BOOT_STATE=${TV_BOOT_STATE:-home}
    # docker.sock is root-equivalent control of the host, and SYS_ADMIN is
    # what the console-blanking ioctl needs. Acceptable because the hub's
    # port is never published - it's reachable only from containers on this
    # compose project's network, never from the LAN.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/tty1:/dev/tty1
    # /dev/input is bind-mounted (rather than passed with `devices:`) plus a
    # cgroup rule for the input major number, so a remote plugged in after
    # the hub started still shows up.
    device_cgroup_rules:
      - "c 13:* r"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/input:/dev/input:ro
      # Docker masks the container's /proc/asound; the host's tells the hub
      # whether audio is playing before an idle sleep.
      - /proc/asound:/host/asound:ro

  tv-home:
    <<: *tv-browser
    container_name: tv-home
    environment:
      - COG_URL=http://tv-hub:8099/
      - AUDIO_DEVICE=${TV_AUDIO_DEVICE:-hdmi:CARD=PCH,DEV=0}

  tv-youtube:
    <<: *tv-browser
    container_name: tv-youtube
    environment:
      - COG_URL=https://www.youtube.com/tv
      # youtube.com/tv redirects anything that doesn't look like a TV. This
      # is a Cobalt (YouTube's own TV runtime) user agent.
      - COG_USER_AGENT=${YOUTUBE_USER_AGENT:-Mozilla/5.0 (Linux armeabi-v7a; Android 9) Cobalt/23.lts.4.308522-gold (unlike Gecko) v8/8.8.278.17-jit gles Starboard/14, Generic_TV_Model/1.0 (Generic, TV, Wired)}
      - AUDIO_DEVICE=${TV_AUDIO_DEVICE:-hdmi:CARD=PCH,DEV=0}
      - XDG_DATA_HOME=/data
      - XDG_CACHE_HOME=/data/cache
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      # Keeps the YouTube sign-in across launches.
      - ./data/youtube:/data
