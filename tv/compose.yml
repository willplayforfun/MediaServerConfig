# TV launcher: a smart-TV home screen on the server's HDMI output.
# tv-hub (profile "tv") switches between the app containers (profile
# "tv-apps"). Only one app can own the display, so "tv-apps" is never in
# COMPOSE_PROFILES and only the hub starts them. Create them once with:
#   docker compose --profile tv-apps create
# Adding an app: a "tv-apps" service, plus <name>=<container_name> in APPS.

x-tv-browser: &tv-browser
  build:
    context: ./browser
  image: homeserver-tv-browser:local
  pull_policy: never
  profiles: ["tv-apps"]
  restart: "no"
  init: true
  devices:
    - /dev/dri:/dev/dri
    - /dev/snd:/dev/snd
    - /dev/input:/dev/input
  group_add:
    - video
    - audio
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - /run/udev:/run/udev:ro   # libinput needs it to see input devices

services:
  tv-hub:
    build:
      context: ./hub
    image: homeserver-tv-hub:local
    pull_policy: never
    container_name: tv-hub
    profiles: ["tv"]
    restart: unless-stopped
    environment:
      - APPS=home=tv-home,youtube=tv-youtube
      - REMOTE_DEVICES=${REMOTE_DEVICES:-}   # blank = every input device
      - HOME_KEY=${HOME_KEY:-KEY_HOMEPAGE}
      - SLEEP_KEY=${SLEEP_KEY:-}
      - HOME_IDLE_MINUTES=${TV_HOME_IDLE_MINUTES:-10}
      - APP_IDLE_MINUTES=${TV_APP_IDLE_MINUTES:-240}
      - BOOT_STATE=${TV_BOOT_STATE:-home}
    # docker.sock and SYS_ADMIN (for console blanking) are root-equivalent.
    # Acceptable only because the hub's port is never published.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/tty1:/dev/tty1
    # Bind mount plus a cgroup rule rather than `devices:`, so a remote
    # plugged in after the hub started still shows up.
    device_cgroup_rules:
      - "c 13:* r"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/input:/dev/input:ro
      # Docker masks the container's own /proc/asound.
      - /proc/asound:/host/asound:ro

  tv-home:
    <<: *tv-browser
    container_name: tv-home
    environment:
      - COG_URL=http://tv-hub:8099/
      - AUDIO_DEVICE=${TV_AUDIO_DEVICE:-hdmi:CARD=PCH,DEV=0}

  tv-youtube:
    <<: *tv-browser
    container_name: tv-youtube
    environment:
      - COG_URL=https://www.youtube.com/tv
      # youtube.com/tv only serves TV user agents; this is Cobalt's.
      - COG_USER_AGENT=${YOUTUBE_USER_AGENT:-Mozilla/5.0 (Linux armeabi-v7a; Android 9) Cobalt/23.lts.4.308522-gold (unlike Gecko) v8/8.8.278.17-jit gles Starboard/14, Generic_TV_Model/1.0 (Generic, TV, Wired)}
      - AUDIO_DEVICE=${TV_AUDIO_DEVICE:-hdmi:CARD=PCH,DEV=0}
      - XDG_DATA_HOME=/data
      - XDG_CACHE_HOME=/data/cache
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      - ./data/youtube:/data   # keeps the YouTube sign-in
