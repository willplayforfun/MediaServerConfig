# TV launcher: a smart-TV home screen on the server's HDMI output.
# tv-hub (profile "tv") switches between the app containers (profile
# "tv-apps"). Only one app can own the display, so "tv-apps" is never in
# COMPOSE_PROFILES and only the hub starts them. `compose up` never creates
# or updates them; env-setup.sh does (tv/env.sh).
# App settings: apps/ is rendered into apps-rendered/ on each `up`.
# Adding an app: apps/<name>.conf, a "tv-apps" service with APP=<name> and
# container_name set to its service name, plus <name>=<container_name> in APPS.

x-tv-browser: &tv-browser
  build:
    context: ./browser
  image: homeserver-tv-browser:local
  pull_policy: never
  profiles: ["tv-apps"]
  restart: "no"
  init: true
  devices:
    - /dev/dri:/dev/dri
    - /dev/snd:/dev/snd
    - /dev/input:/dev/input
  group_add:
    - video
    - audio
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - /run/udev:/run/udev:ro   # libinput needs it to see input devices
    - ./apps-rendered:/config:ro

services:
  # One-shot. Renders apps/ into apps-rendered/ (see template_rendering/).
  tv-render:
    build:
      context: ../template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    profiles: ["tv"]
    volumes:
      - ./apps:/in:ro
      - ./apps-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      - VARS=$${TV_AUDIO_DEVICE}
      - TV_AUDIO_DEVICE=${TV_AUDIO_DEVICE:-hdmi:CARD=PCH,DEV=0}

  tv-hub:
    build:
      context: ./hub
    image: homeserver-tv-hub:local
    pull_policy: never
    container_name: tv-hub
    profiles: ["tv"]
    restart: unless-stopped
    depends_on:
      tv-render:
        condition: service_completed_successfully
    environment:
      - APPS=home=tv-home,youtube=tv-youtube,jellyfin=tv-jellyfin
      - REMOTE_DEVICES=${REMOTE_DEVICES:-}   # blank = every input device
      - HOME_KEY=${HOME_KEY:-KEY_HOMEPAGE}
      - SLEEP_KEY=${SLEEP_KEY:-}
      - HOME_IDLE_MINUTES=${TV_HOME_IDLE_MINUTES:-10}
      - APP_IDLE_MINUTES=${TV_APP_IDLE_MINUTES:-240}
      - BOOT_STATE=${TV_BOOT_STATE:-home}
    # docker.sock and SYS_ADMIN (for console blanking) are root-equivalent.
    # Acceptable only because the hub's port is never published.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/tty1:/dev/tty1
    # Bind mount plus a cgroup rule rather than `devices:`, so a remote
    # plugged in after the hub started still shows up.
    device_cgroup_rules:
      - "c 13:* r"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/input:/dev/input:ro
      # Docker masks the container's own /proc/asound.
      - /proc/asound:/host/asound:ro

  tv-home:
    <<: *tv-browser
    container_name: tv-home
    environment:
      - APP=home

  tv-youtube:
    <<: *tv-browser
    container_name: tv-youtube
    environment:
      - APP=youtube
      - XDG_DATA_HOME=/data
      - XDG_CACHE_HOME=/data/cache
    volumes:   # replaces the shared list, so repeats it
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      - ./apps-rendered:/config:ro
      - ./data/youtube:/data   # keeps the YouTube sign-in

  # Own image (Qt/eglfs, not Cog), but the same device/volume setup.
  tv-jellyfin:
    <<: *tv-browser
    build:
      context: ./jellyfin
    image: homeserver-tv-jellyfin:local
    container_name: tv-jellyfin
    shm_size: 512m   # Chromium crashes on Docker's 64 MB default
    environment:
      - APP=jellyfin
      - XDG_DATA_HOME=/data
      - XDG_CACHE_HOME=/data/cache
      - XDG_CONFIG_HOME=/data/config
    volumes:   # replaces the shared list, so repeats it
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      - ./apps-rendered:/config:ro
      - ./data/jellyfin:/data   # keeps the server address and sign-in
