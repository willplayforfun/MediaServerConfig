# Service locations must proxy to a `set $x_upstream name;` variable, not a
# literal host. That resolves per request, so nginx starts without the optional
# services and a disabled or down one gives 502.
resolver 127.0.0.11 valid=30s ipv6=off;

# ── Help site ─────────────────────────────────────────────────────────────────
location = / {
    return 301 /help/;
}
location /help {
    return 301 /help/;
}
location /help/ {
    alias /usr/share/nginx/html/;
    index index.html;
}
