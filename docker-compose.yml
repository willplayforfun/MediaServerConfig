# Core infrastructure (reverse proxy, TLS, DNS) is defined in this file and
# always runs. Each optional service lives in its own directory with its own
# compose.yml, enabled through its profile in COMPOSE_PROFILES (env-setup.sh
# sets that). Relative paths in an included file resolve against that file's
# directory, so e.g. ./config in jellyfin/compose.yml means jellyfin/config.
include:
  - jellyfin/compose.yml
  - plex/compose.yml
  - universalmediaserver/compose.yml
  - navidrome/compose.yml
  - audiobookshelf/compose.yml
  - stash/compose.yml
  - filebrowser/compose.yml
  - fileflows/compose.yml
  # HDMI display apps - env-setup.sh enables at most one of these.
  - tv/compose.yml
  - kodi/compose.yml

services:
  # ── Helpsite Render ────────────────────────────────────────────────────────
  # One-shot. Walks ./helpsite, renders any *.tmpl files into ./helpsite-rendered
  # via envsubst, copies non-template files verbatim. nginx serves the output.
  helpsite-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - ./helpsite:/in:ro
      - ./helpsite-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      # The literal string passed to envsubst as its allowlist. The $$ escapes
      # are needed so docker-compose doesn't try to expand these itself.
      - VARS=$${DOMAIN} $${PLEX_HTTPS_PORT}
      - DOMAIN=${DOMAIN}
      - PLEX_HTTPS_PORT=${PLEX_HTTPS_PORT}

  # ── Nginx Config Render ──────────────────────────────────────────────────────
  # One-shot. Renders ./nginx-configs/*.tmpl into ./nginx-configs-rendered via
  # envsubst (so the Plex HTTPS port is injected), then nginx mounts the output.
  # nginx runtime $variables ($host, $scheme, ...) are NOT in the allowlist, so
  # envsubst leaves them untouched.
  nginx-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - ./nginx-configs:/in:ro
      - ./nginx-configs-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      - VARS=$${PLEX_HTTPS_PORT}
      - PLEX_HTTPS_PORT=${PLEX_HTTPS_PORT}

  # ── dnsmasq Render ─────────────────────────────────────────────────────────
  dnsmasq-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - ./dnsmasq:/in:ro
      - ./dnsmasq-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      - VARS=$${DOMAIN} $${LOCAL_IP}
      - DOMAIN=${DOMAIN}
      - LOCAL_IP=${LOCAL_IP}

  # ── Cert Init ──────────────────────────────────────────────────────────────
  # One-shot service. Runs before nginx starts.
  # Fast exit if certificates already exist; otherwise issues them via
  # certbot standalone (binds port 80 directly while nginx is not yet running).
  # Set STAGING=1 in .env to test with the Let's Encrypt staging CA first.
  cert-init:
    image: certbot/certbot
    ports:
      - "80:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./scripts/cert-init.sh:/cert-init.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${CERTBOT_EMAIL}
      - STAGING=${STAGING:-}
    entrypoint: ["/bin/sh", "/cert-init.sh"]

  # ── Nginx ──────────────────────────────────────────────────────────────────
  # Unified reverse proxy, TLS termination, and help site.
  # Waits for cert-init and helpsite-render to finish before starting.
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    # Only depends on the file prerequisites: the TLS cert must exist before
    # nginx can bind :443/:${PLEX_HTTPS_PORT}, and the config must be rendered
    # first. nginx does NOT depend on any media service — upstreams are resolved
    # at request time (see resolver in the rendered configs), so a disabled or
    # down backend returns 502 instead of blocking nginx startup.
    depends_on:
      cert-init:
        condition: service_completed_successfully
      helpsite-render:
        condition: service_completed_successfully
      nginx-render:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
      - "${PLEX_HTTPS_PORT}:${PLEX_HTTPS_PORT}"   # Plex HTTPS (proxied at root)
    volumes:
      - ./nginx-configs-rendered/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-configs-rendered/locations.conf:/etc/nginx/locations.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./helpsite-rendered:/usr/share/nginx/html:ro

  # ── Certbot Renewal ────────────────────────────────────────────────────────
  # Long-running loop that checks for renewal every 12 hours.
  # Uses webroot mode (nginx serves the ACME challenge path).
  # Reloads nginx after a successful renewal via docker exec.
  # Requires the Docker socket so it can reach the nginx container.
  certbot-renew:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./scripts/certbot-renew.sh:/certbot-renew.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/certbot-renew.sh"]

  # ── No-IP (Dynamic DNS Update Client) ─────────────────────────────────────
  noip-duc:
    image: noipcom/noip-duc:latest
    container_name: noip-duc
    profiles: ["noip"]
    restart: unless-stopped
    environment:
      - NOIP_USERNAME=${NOIP_USERNAME}
      - NOIP_PASSWORD=${NOIP_PASSWORD}
      - NOIP_HOSTNAMES=${NOIP_HOSTNAMES}
    network_mode: host   # needed so it can detect your real public IP

  # ── Cloudflare DDNS ────────────────────────────────────────────────────────
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    profiles: ["cloudflare"]
    restart: unless-stopped
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${DOMAIN}
      - PROXIED=false
    network_mode: host   # needed so it can detect your real public IP

  # ── dnsmasq (local DNS) ────────────────────────────────────────────────────
  # The address mapping at ./dnsmasq-rendered/local.conf is generated by
  # dnsmasq-render from ./dnsmasq/local.conf.tmpl on each `up`.
  dnsmasq:
    image: dockurr/dnsmasq:latest
    container_name: dnsmasq
    restart: unless-stopped
    depends_on:
      dnsmasq-render:
        condition: service_completed_successfully
    network_mode: host   # binds port 53 directly on the host LAN interface
    cap_add:
      - NET_ADMIN
    environment:
      - DNS1=${DNS1}
      - DNS2=${DNS2}
    volumes:
      - ./dnsmasq-rendered:/etc/dnsmasq.d:ro

  # ── Internal DNS sync (router host override) ───────────────────────────────
  # One-shot. Pushes a ${DOMAIN} -> ${LOCAL_IP} host-override record to the
  # router's own DNS resolver (OPNsense/Unbound via API).
  # Runs to completion on every `up`. Exits 0 immediately when
  # INTERNAL_DNS_ADAPTER is unset, so it is inert until configured.
  internal-dns-init:
    image: python:3.13-alpine
    container_name: internal-dns-init
    restart: "no"
    # Pure stdlib Python — no pip install step needed.
    command: ["python3", "/scripts/sync-internal-dns.py"]
    environment:
      - DOMAIN=${DOMAIN}
      - LOCAL_IP=${LOCAL_IP}
      - INTERNAL_DNS_ADAPTER=${INTERNAL_DNS_ADAPTER:-}
      - DNS_CLEANUP=${DNS_CLEANUP:-true}
      - INTERNAL_DNS_MARKER=${INTERNAL_DNS_MARKER:-}
      - DRY_RUN=${DRY_RUN:-}
      # OPNsense adapter properties
      - OPNSENSE_URL=${OPNSENSE_URL:-}
      - OPNSENSE_API_KEY=${OPNSENSE_API_KEY:-}
      - OPNSENSE_API_SECRET=${OPNSENSE_API_SECRET:-}
      - OPNSENSE_TLS_VERIFY=${OPNSENSE_TLS_VERIFY:-false}
    volumes:
      - ./scripts/sync-internal-dns.py:/scripts/sync-internal-dns.py:ro
