# Core infrastructure, always running. Each optional service has its own
# directory (compose.yml, env.sh, gatus.yaml, nginx-*.conf) and is enabled by
# its profile in COMPOSE_PROFILES. Relative paths in an included file resolve
# against its own directory, so ./config in jellyfin/compose.yml is jellyfin/config.
include:
  - jellyfin/compose.yml
  - plex/compose.yml
  - universalmediaserver/compose.yml
  - navidrome/compose.yml
  - audiobookshelf/compose.yml
  - stash/compose.yml
  - filebrowser/compose.yml
  - fileflows/compose.yml
  # HDMI display apps - env-setup.sh enables at most one of these.
  - tv/compose.yml
  - kodi/compose.yml

services:
  # ── Helpsite Render ────────────────────────────────────────────────────────
  # One-shot. Renders ./helpsite into ./helpsite-rendered, which nginx serves.
  helpsite-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - ./helpsite:/in:ro
      - ./helpsite-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      # envsubst's allowlist; $$ stops Compose expanding it.
      - VARS=$${DOMAIN} $${PLEX_HTTPS_PORT}
      - DOMAIN=${DOMAIN}
      - PLEX_HTTPS_PORT=${PLEX_HTTPS_PORT}

  # ── Nginx Config Render ──────────────────────────────────────────────────────
  # One-shot. Assembles ./nginx-configs-rendered (core plus the enabled profiles'
  # nginx-*.conf) for nginx to mount. envsubst runs on .tmpl files only, and its
  # allowlist leaves nginx's own $variables ($host, $scheme, ...) untouched.
  nginx-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - .:/repo:ro
      - ./nginx-configs-rendered:/out
      - ./scripts:/scripts:ro
    environment:
      - REPO=/repo
      - OUT=/out
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
      - VARS=$${PLEX_HTTPS_PORT}
      - PLEX_HTTPS_PORT=${PLEX_HTTPS_PORT}
    entrypoint: ["/bin/sh", "/scripts/nginx-render.sh"]

  # ── dnsmasq Render ─────────────────────────────────────────────────────────
  dnsmasq-render:
    build:
      context: ./template_rendering
      dockerfile: Dockerfile
    image: homeserver-renderer:local
    pull_policy: never
    volumes:
      - ./dnsmasq:/in:ro
      - ./dnsmasq-rendered:/out
    environment:
      - IN=/in
      - OUT=/out
      - VARS=$${DOMAIN} $${LOCAL_IP}
      - DOMAIN=${DOMAIN}
      - LOCAL_IP=${LOCAL_IP}

  # ── Gatus Render ───────────────────────────────────────────────────────────
  # One-shot. Assembles ./gatus-rendered from the enabled profiles' gatus.yaml.
  gatus-render:
    image: alpine:latest
    volumes:
      - .:/repo:ro
      - ./gatus-rendered:/out
      - ./scripts:/scripts:ro
    environment:
      - REPO=/repo
      - OUT=/out
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    entrypoint: ["/bin/sh", "/scripts/gatus-render.sh"]

  # ── Gatus ──────────────────────────────────────────────────────────────────
  # Health dashboard for every enabled service. LAN only, on its own port:
  # Gatus can't be served under an nginx subpath.
  gatus:
    image: twinproduction/gatus:stable
    container_name: gatus
    restart: unless-stopped
    depends_on:
      gatus-render:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    environment:
      - GATUS_CONFIG_PATH=/config
      - DOMAIN=${DOMAIN}
      - LOCAL_IP=${LOCAL_IP}
    volumes:
      - ./gatus-rendered:/config:ro
      - ./gatus/data:/data

  # ── Cert Init ──────────────────────────────────────────────────────────────
  # One-shot, before nginx. Issues the certificate with certbot standalone if
  # it doesn't exist yet. STAGING=1 in .env uses Let's Encrypt's staging CA.
  cert-init:
    image: certbot/certbot
    ports:
      - "80:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./scripts/cert-init.sh:/cert-init.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${CERTBOT_EMAIL}
      - STAGING=${STAGING:-}
    entrypoint: ["/bin/sh", "/cert-init.sh"]

  # ── Nginx ──────────────────────────────────────────────────────────────────
  # Unified reverse proxy, TLS termination, and help site.
  # Waits for cert-init and helpsite-render to finish before starting.
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    # Only depends on the file prerequisites: the TLS cert must exist before
    # nginx can bind :443/:${PLEX_HTTPS_PORT}, and the config must be rendered
    # first. nginx does NOT depend on any media service — upstreams are resolved
    # at request time (see resolver in the rendered configs), so a disabled or
    # down backend returns 502 instead of blocking nginx startup. A re-render
    # isn't picked up until nginx reloads (docs/OperationsGuide.md).
    depends_on:
      cert-init:
        condition: service_completed_successfully
      helpsite-render:
        condition: service_completed_successfully
      nginx-render:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
      - "${PLEX_HTTPS_PORT}:${PLEX_HTTPS_PORT}"   # Plex HTTPS (proxied at root)
    volumes:
      - ./nginx-configs-rendered:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./helpsite-rendered:/usr/share/nginx/html:ro

  # ── Certbot Renewal ────────────────────────────────────────────────────────
  # Tries renewal every 12 hours through nginx's ACME path, then reloads nginx
  # (hence the Docker socket).
  certbot-renew:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./scripts/certbot-renew.sh:/certbot-renew.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/certbot-renew.sh"]

  # ── No-IP (Dynamic DNS Update Client) ─────────────────────────────────────
  noip-duc:
    image: noipcom/noip-duc:latest
    container_name: noip-duc
    profiles: ["noip"]
    restart: unless-stopped
    environment:
      - NOIP_USERNAME=${NOIP_USERNAME:-}
      - NOIP_PASSWORD=${NOIP_PASSWORD:-}
      - NOIP_HOSTNAMES=${NOIP_HOSTNAMES:-}
    network_mode: host   # needed so it can detect your real public IP

  # ── Cloudflare DDNS ────────────────────────────────────────────────────────
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    profiles: ["cloudflare"]
    restart: unless-stopped
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - DOMAINS=${DOMAIN}
      - PROXIED=false
    network_mode: host   # needed so it can detect your real public IP

  # ── dnsmasq (local DNS) ────────────────────────────────────────────────────
  # Resolves ${DOMAIN} to the LAN IP for local clients (config from dnsmasq-render).
  dnsmasq:
    image: dockurr/dnsmasq:latest
    container_name: dnsmasq
    restart: unless-stopped
    depends_on:
      dnsmasq-render:
        condition: service_completed_successfully
    network_mode: host   # binds port 53 directly on the host LAN interface
    cap_add:
      - NET_ADMIN
    environment:
      - DNS1=${DNS1}
      - DNS2=${DNS2}
    volumes:
      - ./dnsmasq-rendered:/etc/dnsmasq.d:ro

  # ── Internal DNS sync (router host override) ───────────────────────────────
  # One-shot on every `up`. Pushes a ${DOMAIN} -> ${LOCAL_IP} host override to
  # the router's DNS (OPNsense). Does nothing while INTERNAL_DNS_ADAPTER is unset.
  internal-dns-init:
    image: python:3.13-alpine
    container_name: internal-dns-init
    restart: "no"
    # Stdlib only, so no pip install.
    command: ["python3", "/scripts/sync-internal-dns.py"]
    environment:
      - DOMAIN=${DOMAIN}
      - LOCAL_IP=${LOCAL_IP}
      - INTERNAL_DNS_ADAPTER=${INTERNAL_DNS_ADAPTER:-}
      - DNS_CLEANUP=${DNS_CLEANUP:-true}
      - INTERNAL_DNS_MARKER=${INTERNAL_DNS_MARKER:-}
      - DRY_RUN=${DRY_RUN:-}
      # OPNsense adapter
      - OPNSENSE_URL=${OPNSENSE_URL:-}
      - OPNSENSE_API_KEY=${OPNSENSE_API_KEY:-}
      - OPNSENSE_API_SECRET=${OPNSENSE_API_SECRET:-}
      - OPNSENSE_TLS_VERIFY=${OPNSENSE_TLS_VERIFY:-false}
    volumes:
      - ./scripts/sync-internal-dns.py:/scripts/sync-internal-dns.py:ro
